<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS Gerada com Sucesso - CARSO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .success-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .success-icon {
            font-size: 55px;
            color: #10b981;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-novo {
            display: inline-block;
            width: 100%;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .btn-novo:hover {
            background-color: #1d4ed8;
        }

        .btn-novo:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">✅</div>
        <h2>OS {{ num_os }} Gerada com Sucesso!</h2>
        <p>O documento foi processado via Excel/VBA, o PDF foi gerado com sucesso e o e-mail foi devidamente aberto e anexado no Outlook para envio.</p>
        <a href="/" class="btn-novo">Preencher Nova OS</a>
    </div>

</body>
</html>
